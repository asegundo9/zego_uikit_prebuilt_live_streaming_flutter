name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '11'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          cache: true

      - name: Build APK
        run: |
          # حذف أدوات الفحص والاختبار الثانوية التي تسبب التعارض
          sed -i '/flutter_lints/d' example/pubspec.yaml || true
          sed -i '/flutter_lints/d' pubspec.yaml || true
          sed -i '/flutter_test:/,/sdk: flutter/d' example/pubspec.yaml || true
          rm -f example/analysis_options.yaml analysis_options.yaml || true
          
          # فرض تجاوز تعارض حزمة path نهائياً
          cat << 'EOF' >> example/pubspec.yaml

          dependency_overrides:
            path: any
          EOF
          
          # الانتقال لمجلد التطبيق وتجميع الـ APK
          cd example
          flutter pub get
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: live-streaming-app
          path: example/build/app/outputs/flutter-apk/app-release.apk
          
