import 'dart:math';
import 'package:flutter/material.dart';
import 'package:cached_network_image/cached_network_image.dart';
import 'package:zego_uikit/zego_uikit.dart';
import 'package:zego_uikit_prebuilt_live_streaming/zego_uikit_prebuilt_live_streaming.dart';

class ZegoConfig {
  static const int appID = 1883215575;
  static const String appSign =
      '7b5391081998de1b813d9a93d4049c62043881028f4ea30aa6371f397ebe9d40';
}

final String localUserID = '${Random().nextInt(90000) + 10000}';
final String localUserName = 'user_$localUserID';

void main() {
  WidgetsFlutterBinding.ensureInitialized();
  ZegoUIKit().initLog().then((_) {
    runApp(const LiveStreamApp());
  });
}

class LiveStreamApp extends StatelessWidget {
  const LiveStreamApp({super.key});

  @override
  Widget build(BuildContext context) {
    return MaterialApp(
      title: 'ZEGOCLOUD Live Streaming',
      debugShowCheckedModeBanner: false,
      theme: ThemeData.dark().copyWith(
        scaffoldBackgroundColor: const Color(0xFF141622),
        colorScheme: const ColorScheme.dark(
          primary: Color(0xFF6C5CE7),
          surface: Color(0xFF1E2337),
        ),
      ),
      home: const HomePage(),
    );
  }
}

class HomePage extends StatefulWidget {
  const HomePage({super.key});

  @override
  State<HomePage> createState() => _HomePageState();
}

class _HomePageState extends State<HomePage> {
  final TextEditingController _roomIDController = TextEditingController(
    text: '${Random().nextInt(9000) + 1000}',
  );

  @override
  void dispose() {
    _roomIDController.dispose();
    super.dispose();
  }

  void _navigateToLive(BuildContext context, {required bool isHost}) {
    final roomID = _roomIDController.text.trim();
    if (roomID.isEmpty) return;

    if (ZegoUIKitPrebuiltLiveStreamingController().minimize.isMinimizing) {
      return;
    }

    Navigator.push(
      context,
      MaterialPageRoute(
        builder: (context) => LivePage(
          liveID: roomID,
          isHost: isHost,
        ),
      ),
    );
  }

  @override
  Widget build(BuildContext context) {
    return ZegoUIKitPrebuiltLiveStreamingMiniPopScope(
      child: Scaffold(
        appBar: AppBar(
          title: const Text(
            'Live Stream Portal',
            style: TextStyle(fontWeight: FontWeight.bold),
          ),
          centerTitle: true,
          elevation: 0,
          backgroundColor: Colors.transparent,
        ),
        body: Center(
          child: SingleChildScrollView(
            padding: const EdgeInsets.symmetric(horizontal: 24.0),
            child: Column(
              mainAxisAlignment: MainAxisAlignment.center,
              children: [
                CircleAvatar(
                  radius: 40,
                  backgroundColor: const Color(0xFF6C5CE7).withOpacity(0.2),
                  child: const Icon(
                    Icons.cell_tower,
                    size: 44,
                    color: Color(0xFF6C5CE7),
                  ),
                ),
                const SizedBox(height: 20),
                Text(
                  'Your User ID: $localUserID',
                  style: const TextStyle(
                    fontSize: 16,
                    fontWeight: FontWeight.bold,
                    letterSpacing: 0.5,
                  ),
                ),
                const SizedBox(height: 6),
                const Text(
                  'Join with another device using the same Live ID',
                  style: TextStyle(fontSize: 12, color: Colors.grey),
                ),
                const SizedBox(height: 32),
                TextFormField(
                  controller: _roomIDController,
                  keyboardType: TextInputType.number,
                  decoration: InputDecoration(
                    labelText: 'Live Room ID',
                    prefixIcon: const Icon(Icons.numbers),
                    filled: true,
                    fillColor: const Color(0xFF1E2337),
                    border: OutlineInputBorder(
                      borderRadius: BorderRadius.circular(14),
                      borderSide: BorderSide.none,
                    ),
                  ),
                ),
                const SizedBox(height: 30),
                Row(
                  children: [
                    Expanded(
                      child: ElevatedButton.icon(
                        icon: const Icon(Icons.videocam, color: Colors.white),
                        label: const Text(
                          'Start Live',
                          style: TextStyle(
                              color: Colors.white, fontWeight: FontWeight.bold),
                        ),
                        style: ElevatedButton.styleFrom(
                          backgroundColor: const Color(0xFF6C5CE7),
                          padding: const EdgeInsets.symmetric(vertical: 16),
                          shape: RoundedRectangleBorder(
                            borderRadius: BorderRadius.circular(14),
                          ),
                        ),
                        onPressed: () => _navigateToLive(context, isHost: true),
                      ),
                    ),
                    const SizedBox(width: 14),
                    Expanded(
                      child: ElevatedButton.icon(
                        icon: const Icon(Icons.remove_red_eye,
                            color: Colors.white),
                        label: const Text(
                          'Watch Live',
                          style: TextStyle(
                              color: Colors.white, fontWeight: FontWeight.bold),
                        ),
                        style: ElevatedButton.styleFrom(
                          backgroundColor: const Color(0xFF2C324B),
                          padding: const EdgeInsets.symmetric(vertical: 16),
                          shape: RoundedRectangleBorder(
                            borderRadius: BorderRadius.circular(14),
                          ),
                        ),
                        onPressed: () =>
                            _navigateToLive(context, isHost: false),
                      ),
                    ),
                  ],
                ),
              ],
            ),
          ),
        ),
      ),
    );
  }
}

class LivePage extends StatefulWidget {
  final String liveID;
  final bool isHost;

  const LivePage({
    super.key,
    required this.liveID,
    this.isHost = false,
  });

  @override
  State<LivePage> createState() => _LivePageState();
}

class _LivePageState extends State<LivePage> {
  @override
  Widget build(BuildContext context) {
    final config = widget.isHost
        ? ZegoUIKitPrebuiltLiveStreamingConfig.host()
        : ZegoUIKitPrebuiltLiveStreamingConfig.audience();

    config.avatarBuilder = customAvatarBuilder;

    return SafeArea(
      child: ZegoUIKitPrebuiltLiveStreaming(
        appID: ZegoConfig.appID,
        appSign: ZegoConfig.appSign,
        userID: localUserID,
        userName: localUserName,
        liveID: widget.liveID,
        config: config,
      ),
    );
  }
}

Widget customAvatarBuilder(
  BuildContext context,
  Size size,
  ZegoUIKitUser? user,
  Map<String, dynamic> extraInfo,
) {
  final uid = user?.id ?? 'default';
  return CachedNetworkImage(
    imageUrl: 'https://robohash.org/$uid.png',
    imageBuilder: (context, imageProvider) => Container(
      decoration: BoxDecoration(
        shape: BoxShape.circle,
        image: DecorationImage(
          image: imageProvider,
          fit: BoxFit.cover,
        ),
      ),
    ),
    progressIndicatorBuilder: (context, url, downloadProgress) =>
        CircularProgressIndicator(value: downloadProgress.progress),
    errorWidget: (context, url, error) {
      return ZegoAvatar(user: user, avatarSize: size);
    },
  );
}
