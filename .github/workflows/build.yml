name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          cache: true

      - name: Build APK
        run: |
          # 1. إزالة أدوات الفحص والاختبار الروتينية
          sed -i '/flutter_lints/d' example/pubspec.yaml || true
          sed -i '/flutter_lints/d' pubspec.yaml || true
          sed -i '/flutter_test:/,/sdk: flutter/d' example/pubspec.yaml || true
          rm -f example/analysis_options.yaml analysis_options.yaml || true
          # 2. فرض الإصدارات المستقرة والمتوافقة للمكتبات
          echo "" >> example/pubspec.yaml
          echo "dependency_overrides:" >> example/pubspec.yaml
          echo "  file_picker: 8.1.7" >> example/pubspec.yaml
          echo "  connectivity_plus: 5.0.2" >> example/pubspec.yaml
          echo "  device_info_plus: 11.3.0" >> example/pubspec.yaml
          echo "  path: any" >> example/pubspec.yaml
          echo "" >> pubspec.yaml
          echo "dependency_overrides:" >> pubspec.yaml
          echo "  file_picker: 8.1.7" >> pubspec.yaml
          echo "  connectivity_plus: 5.0.2" >> pubspec.yaml
          echo "  device_info_plus: 11.3.0" >> pubspec.yaml
          echo "  path: any" >> pubspec.yaml
          # 3. ترقية Gradle وضبط مسار أدوات الأندرويد
          sed -i 's/gradle-[0-9.]\+-all.zip/gradle-7.6.1-all.zip/g' example/android/gradle/wrapper/gradle-wrapper.properties || true
          sed -i 's/gradle-[0-9.]\+-bin.zip/gradle-7.6.1-all.zip/g' example/android/gradle/wrapper/gradle-wrapper.properties || true
          sed -i "s/com.android.tools.build:gradle:[0-9.]\+/com.android.tools.build:gradle:7.3.0/g" example/android/build.gradle || true
          sed -i "s/ext.kotlin_version = ['\"][0-9.]\+['\"]/ext.kotlin_version = '1.8.22'/g" example/android/build.gradle || true
          # 4. تجميع الـ APK النهائي
          cd example
          flutter pub get
          flutter build apk --release --android-skip-build-dependency-validation
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: live-streaming-app
          path: example/build/app/outputs/flutter-apk/app-release.apk
