name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '11'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          cache: true

      - name: Build APK
        run: |
          # 1. إزالة أدوات الفحص والاختبار الثانوية
          sed -i '/flutter_lints/d' example/pubspec.yaml || true
          sed -i '/flutter_lints/d' pubspec.yaml || true
          sed -i '/flutter_test:/,/sdk: flutter/d' example/pubspec.yaml || true
          rm -f example/analysis_options.yaml analysis_options.yaml || true

          # 2. تثبيت إصدارات متوافقة لتفادي تعارض أندرويد
          echo "" >> example/pubspec.yaml
          echo "dependency_overrides:" >> example/pubspec.yaml
          echo "  connectivity_plus: 5.0.2" >> example/pubspec.yaml
          echo "  device_info_plus: 11.1.0" >> example/pubspec.yaml
          echo "  path: any" >> example/pubspec.yaml

          echo "" >> pubspec.yaml
          echo "dependency_overrides:" >> pubspec.yaml
          echo "  connectivity_plus: 5.0.2" >> pubspec.yaml
          echo "  device_info_plus: 11.1.0" >> pubspec.yaml
          echo "  path: any" >> pubspec.yaml

          # 3. تخطي فحص الإصدار وتجميع ملف الـ APK
          cd example
          flutter pub get
          flutter build apk --release --android-skip-build-dependency-validation

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: live-streaming-app
          path: example/build/app/outputs/flutter-apk/app-release.apk
